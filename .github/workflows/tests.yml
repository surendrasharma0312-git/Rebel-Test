name: Node.js tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Install Firestore rules test dependencies
        run: npm install --no-save --package-lock=false @firebase/rules-unit-testing firebase
      - name: Run Firestore emulator rules tests
        run: npm run test:firestore
